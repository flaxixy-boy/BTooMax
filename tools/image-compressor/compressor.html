<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Compressor - BTooMax</title><link rel="stylesheet" href="compressor.css"></head><body><main><a href="../../index.html">&lt;- BTooMax</a><h1>Image <span>Compressor</span></h1><p>Compress images locally in your browser. No upload.</p><section class="card"><label id="drop" for="file"><input id="file" type="file" accept="image/*" hidden><b>+</b><strong>Choose or drop an image</strong><small>JPG, PNG, WebP, AVIF and other browser-supported images</small></label><div id="work" hidden><div class="row"><span><small>File</small><strong id="name"></strong><small id="meta"></small></span><button id="remove">Remove</button></div><img id="preview"><div class="settings"><div class="row"><span>Format</span><select id="format"><option value="image/webp">WebP</option><option value="image/avif">AVIF</option><option value="image/jpeg">JPG</option><option value="image/png">PNG</option></select></div><div class="row"><span>Quality <b id="qv">80</b>%</span></div><input id="quality" type="range" min="20" max="100" value="80"><button id="compress">Compress image</button></div><div id="result" hidden><div class="row"><b id="size"></b><b id="saved"></b></div><div class="bar"><i id="fill"></i></div><button id="download">Download image</button></div></div></section><footer>Everything is processed on your device.</footer></main><script src="compressor.js"></script></body></html>
